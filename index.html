<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Momentum</title>

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0F172A">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Momentum">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<script src="chart.js"></script>

</head>

<body>

<div class="container">

<header>

<h1>Momentum</h1>

<p id="todayDate"></p>

</header>

<nav>

<button class="tab active" data-page="today">
Hoy
</button>

<button class="tab" data-page="history">
Historial
</button>

<button class="tab" data-page="stats">
Estadísticas
</button>

</nav>

<main>

<section id="today" class="page active">

<div class="top">

<h2>Mis hábitos</h2>

<button id="addHabit">

＋

</button>

</div>

<div class="progress">

<div id="progressFill"></div>

</div>

<p id="progressText">

0%

</p>

<div id="habitList">

</div>

</section>

<section id="history" class="page">

    <div class="history-header">

    <div>
        <h2>Historial</h2>
        <p id="weekTitle">Esta semana</p>
    </div>

    <div class="week-navigation">

        <button id="previousWeek" aria-label="Semana anterior">
            ‹
        </button>

        <button id="nextWeek" aria-label="Semana siguiente">
            ›
        </button>

    </div>

</div>

    <div id="weekCalendar" class="week-calendar">
        <!-- Los días se crean automáticamente -->
    </div>

    <div id="selectedDay" class="selected-day">
        <!-- Acá aparecerán los hábitos del día seleccionado -->
    </div>

</section>

<section id="stats" class="page">
    <div class="stats-header">

    <div>
        <h2>Estadísticas</h2>
        <p>Tu progreso</p>
    </div>

    <div class="stats-filters">

        <button class="stats-filter active" data-range="7">
            7 días
        </button>

        <button class="stats-filter" data-range="30">
            30 días
        </button>

        <button class="stats-filter" data-range="all">
            Todo
        </button>

    </div>

</div>

<div class="card">

<h3>

Cumplimiento

</h3>

<canvas id="chart"></canvas>

</div>

<div class="statsGrid">

<div class="card">

<p>Promedio semanal</p>

<h2 id="weekAverage">

0%

</h2>

</div>

<div class="card">

<p>Promedio mensual</p>

<h2 id="monthAverage">

0%

</h2>

</div>

</div>

</section>

</main>

</div>

<div id="modal" class="modal hidden">

<div class="modalBox">

<h2>

Nuevo hábito

</h2>

<input
id="habitInput"
placeholder="Ej: Gym">

<div class="buttons">

<button id="cancel">

Cancelar

</button>

<button id="saveHabit">

Guardar

</button>

</div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
